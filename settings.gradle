pluginManagement {
    repositories {
        // mavenLocal() is intentionally absent. Build plugins execute code, so
        // resolving them from a mutable local cache first is a supply-chain risk.
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'schematicraft-mod'
