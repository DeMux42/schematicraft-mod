pluginManagement {
    repositories {
        // mavenLocal() is intentionally absent. Build plugins execute code, so
        // resolving them from a mutable local cache first is a supply-chain risk.
        // Fabric Loom and the Fabric toolchain live on the Fabric maven.
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'schematicraft-mod'
