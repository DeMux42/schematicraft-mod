modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "logo.png"
displayURL = "${mod_display_url}"
issueTrackerURL = "${mod_issue_tracker_url}"
credits = "${mod_credits}"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
# Exact pin. This jar is built against 1.20.1 and must not load on another
# version. The 1.21.1 and future builds are their own jars.
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
mandatory = false
versionRange = "[6.0,)"
ordering = "AFTER"
side = "CLIENT"
