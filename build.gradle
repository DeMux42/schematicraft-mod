plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    // mavenLocal() is intentionally absent. It takes precedence over remote
    // repositories, so a stale or poisoned artifact in the local cache would
    // silently enter the build. Add it temporarily and locally if you need to
    // test an unpublished dependency.
    mavenCentral()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.theillusivec4.top/" }
    exclusiveContent {
        forRepository { maven { url "https://cursemaven.com" } }
        filter { includeGroup "curse.maven" }
    }
}

base {
    // The Minecraft version belongs in the filename, not in mod_version. Users pick
    // jars by filename, so a 1.21.1 build and a future 1.26 build must not be
    // indistinguishable in a mods folder. Produces:
    //   schematicraft-1.21.1-0.4.0.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Shared, editor-agnostic Schematicraft library (browse/search/download/preview/camera).
// Kept as a separate source module so Fabric and Forge editor mods can reuse it.
// For release builds this would become a jarJar dependency instead.
sourceSets.main.java.srcDir '../schematicraft-lib/src/main/java'

// Official Schematicraft API client (shared across all integrations)
sourceSets.main.java.srcDir '../../api-clients/java/src'

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Editors are optional. Their types are referenced directly by the integration
// code, so an editor that is on the build is needed on the compile classpath,
// and each can also be left off the runtime classpath to verify that the mod
// degrades correctly when that editor is not installed:
//
//   gradlew runClient -PwithBG2=false
//   gradlew runClient -PwithCreate=false
//   gradlew runClient -PwithBG2=false -PwithCreate=false
//
// withBG2 defaults to true: Building Gadgets 2 has a Minecraft 26.1 build
// (v1.4.6, CurseMaven file 7964119), so it is on the 26.1 jar.
//
// withCreate defaults to FALSE on 26.1: Create has no Minecraft 26.1 build.
// Its newest release is 6.0.10 for 1.21.1 (project 328085). Until a 26.1 Create
// ships, Create is left out of the 26.1 jar: its coordinate is not resolved and
// its runtime classpath entry is off. When a 26.1 Create build exists, pin its
// file id below and flip this default back to true. This is the equivalent of
// the per-editor "leave it out" switch for an editor with no build for 26.1.
def withBG2 = Boolean.parseBoolean((findProperty('withBG2') ?: 'true').toString())
def withCreate = Boolean.parseBoolean((findProperty('withCreate') ?: 'false').toString())

// The Create integration glue references Create types directly, so it can only
// be compiled when Create is on the compile classpath. With withCreate=false
// (the 26.1 default, since Create has no 26.1 build) the Create coordinate is
// not resolved, so the Create glue source is excluded from compilation too.
// This is "compile the editor glue out when the editor is absent"; the BG2 glue
// is always compiled because BG2 has a 26.1 build and is always on the classpath.
if (!withCreate) {
    sourceSets.main.java.exclude 'com/schematicraft/create/**'
}

dependencies {
    // Building Gadgets 2, Minecraft 26.1 build (CurseMaven project 298187,
    // file 7964119 = v1.4.6; neoforge.mods.toml: minecraft [26.1,26.2),
    // neoforge [26.1.2.21-beta,); licence MIT). The BG2 glue references BG2
    // types directly, so BG2 stays on the compile classpath unconditionally;
    // only its runtime entry is gated by withBG2, which is how the runtime
    // "editor not installed" degradation is tested.
    compileOnly "curse.maven:building-gadgets-298187:7964119"

    // BG2 v1.4.6 drops the Curios dependency the 1.21.1 line (v1.3.9) carried,
    // and the mod never references Curios types itself, so Curios is no longer
    // on the 26.1 build. (1.21.1 pinned curios-309927:6529130 for BG2.)

    // Create has no Minecraft 26.1 build (newest is 6.0.10 for 1.21.1, project
    // 328085). It is therefore left off the 26.1 jar via withCreate=false
    // above: neither its compile coordinate nor its runtime entry is added, so
    // dependency resolution does not try to fetch a nonexistent 26.1 file.
    // When a 26.1 Create build exists, pin its CurseMaven file id here and flip
    // withCreate's default back to true.
    if (withCreate) {
        compileOnly "curse.maven:create-328085:7178775"
    }

    if (withBG2) {
        localRuntime "curse.maven:building-gadgets-298187:7964119"
    }

    if (withCreate) {
        localRuntime "curse.maven:create-328085:7178775"
    }

    // Gson is bundled with MC, declared for clarity
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_display_url        : mod_display_url,
            mod_issue_tracker_url  : mod_issue_tracker_url,
            mod_credits            : mod_credits
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
