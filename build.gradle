plugins {
    id 'fabric-loom' version '1.14.10'
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    // The Minecraft version belongs in the filename, not in mod_version, so a
    // 1.21.1 Fabric build and a 1.21.1 NeoForge build are never indistinguishable
    // in a mods folder. Produces schematicraft-1.21.1-0.4.0-alpha.2.jar, matching
    // the NeoForge convention.
    archivesName = "${mod_id}-${minecraft_version}"
}

repositories {
    // mavenLocal() is intentionally absent, as on the NeoForge build: it takes
    // precedence over remote repositories, so a stale or poisoned artifact in the
    // local cache would silently enter the build.
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Litematica (editor, LGPL-3.0-only) and malilib (its library, LGPL-3.0-only).
//
// Pinned exact files verified by their SHA-512, fetched from Modrinth's CDN,
// never vendored, never in CI, never in the shipped jar. This is the same
// owner-approved pattern (2026-10-04) the engine's Litematica conformance
// harness uses (engine/conformance/litematica-1.21.1/build.gradle), applied here
// because Loom remaps mod dependencies at configuration time and the editor is a
// compile-only, runtime-optional integration whose supply chain must be pinned.
//
// The file handoff writes a .litematic into Litematica's schematics directory,
// exactly as the NeoForge Create glue writes a .nbt into Create's folder; the mod
// neither bundles nor statically links Litematica.
def pinnedEditors = [
    [
        file: 'litematica-fabric-1.21-0.19.61.jar',
        url: 'https://cdn.modrinth.com/data/bEpr0Arc/versions/o7i8oi1Z/litematica-fabric-1.21-0.19.61.jar',
        sha512: '626d0b9785afa5cd9915a25089213332b0ae6805e992a15c12292fa174146a354c7fa891e5f834e2eb10c281dbd4b4d69081649b2a83b48f22a66bc99220b328',
    ],
    [
        file: 'malilib-fabric-1.21-0.21.10.jar',
        url: 'https://cdn.modrinth.com/data/GcWjdA9I/versions/C99LEy6r/malilib-fabric-1.21-0.21.10.jar',
        sha512: '9f70b4605ea23f8c8b519622a6cbdcac6c8934c70bab3b8ea2d5da071a37e71ff74406d2e154c5ba4ebc7772d76e97ae94f5760e71632bd8a11d23ae8ae9a111',
    ],
]

// Loom remaps mod dependencies while the project is configured, so the files are
// fetched and checked here, before the dependencies block names them. libs/ is
// gitignored.
def libs = file('libs')
libs.mkdirs()
def sha512 = { File f -> java.security.MessageDigest.getInstance('SHA-512').digest(f.bytes).encodeHex().toString() }
pinnedEditors.each { p ->
    def f = new File(libs, p.file)
    if (!f.exists() || sha512(f) != p.sha512) {
        logger.lifecycle("fetching ${p.file}")
        new URL(p.url).withInputStream { i -> f.withOutputStream { o -> o << i } }
    }
    if (sha512(f) != p.sha512) {
        f.delete()
        throw new GradleException("${p.file}: the downloaded file does not have the pinned SHA-512")
    }
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

// Shared, editor-agnostic Schematicraft library (browse/search/download/preview/
// camera). Kept as a source include exactly as on the NeoForge build so there is
// one copy of the library code. For release builds this would become a jarJar/
// include dependency instead.
// Exclude the loader-specific source that has no Fabric counterpart, rather than
// deleting it from the shared tree (master and neoforge/* still build it). These
// are left out of the Fabric source set with a reason:
//  - SchematiCraftMod.java: the NeoForge @Mod entry point. Fabric uses
//    com.schematicraft.fabric.SchematicraftFabric / SchematicraftFabricClient.
//  - bg2addon/**: the Building Gadgets 2 integration (client, server and
//    networking). BG2 is a NeoForge-ecosystem mod with no Fabric 1.21.1 build, so
//    none of it compiles or runs on Fabric; the Fabric editor is Litematica.
//  - create/**: the Create integration. Create has no Fabric 1.21.1 build
//    (confirmed: no create or create-fabric 1.21.1 Fabric file on Modrinth), so
//    its glue has nothing to compile against on Fabric.
// The Fabric mod is therefore client-only with no server or networking half.
sourceSets.main.java.exclude 'com/schematicraft/SchematiCraftMod.java'
// client/ClientSetup.java registers keybinds via the NeoForge RegisterKeyMappingsEvent;
// on Fabric that is done in SchematicraftFabricClient via KeyBindingHelper, so the
// NeoForge-shaped file is excluded here (kept in the shared tree for master/neoforge).
sourceSets.main.java.exclude 'com/schematicraft/client/ClientSetup.java'
sourceSets.main.java.exclude 'com/schematicraft/bg2addon/**'
sourceSets.main.java.exclude 'com/schematicraft/create/**'

sourceSets.main.java.srcDir '../schematicraft-lib/src/main/java'

// Official Schematicraft API client (shared across all integrations; zero
// Minecraft dependencies).
sourceSets.main.java.srcDir '../../api-clients/java/src'

// Litematica is optional at runtime. Its types are referenced directly by the
// integration code, so it is always needed on the compile classpath, but it can
// be left off the runtime classpath to verify the mod degrades correctly when the
// editor is not installed:
//
//   gradlew runClient -PwithLitematica=false
//
// Defaults to true, so a normal dev run is unchanged.
def withLitematica = Boolean.parseBoolean((findProperty('withLitematica') ?: 'true').toString())

dependencies {
    // Fabric toolchain. Pinned exactly; see gradle.properties for the sources.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Editor on the COMPILE classpath only (never bundled). malilib needs these
    // Fabric API modules to resolve, matching the conformance harness.
    pinnedEditors.each { p -> modCompileOnly files("libs/${p.file}") }

    if (withLitematica) {
        pinnedEditors.each { p -> modLocalRuntime files("libs/${p.file}") }
    }

    // Gson is bundled with Minecraft at runtime; declared for clarity.
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property "version", project.version
    // The NeoForge access transformer is not used on Fabric (fabric.mod.json does
    // not reference it). Keep the file in the shared tree for master/neoforge, but
    // do not ship it in the Fabric jar.
    exclude 'META-INF/accesstransformer.cfg'
    def replaceProperties = [
            version                : mod_version,
            minecraft_version      : minecraft_version,
            loader_version         : loader_version,
            fabric_version         : fabric_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_display_url        : mod_display_url,
            mod_issue_tracker_url  : mod_issue_tracker_url,
            mod_credits            : mod_credits
    ]
    inputs.properties replaceProperties
    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
