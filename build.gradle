plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
}

version = mod_version
group = mod_group_id

base {
    // The Minecraft version belongs in the filename, not in mod_version. Users pick
    // jars by filename, so a 1.20.1 build and the 1.21.1 build must not be
    // indistinguishable in a mods folder. Produces:
    //   schematicraft-1.20.1-0.4.0-alpha.2.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

// Forge 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    // Access transformer. Empty today (only comments), kept so a later entry has
    // a home and the mods.toml accessTransformers block has a file to point at.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Shared, editor-agnostic Schematicraft library (browse/search/download/preview/camera).
// Kept as a separate source module so Forge, NeoForge, and Fabric editor mods can
// reuse it. Same source-include shape as the 1.21.1 build, pointed at the library's
// Forge 1.20.1 branch so it compiles against 1.20.1 mappings.
sourceSets.main.java.srcDir '../schematicraft-lib/src/main/java'

// Official Schematicraft API client (shared across all integrations, zero MC deps).
sourceSets.main.java.srcDir '../../api-clients/java/src'

repositories {
    // mavenLocal() is intentionally absent. It takes precedence over remote
    // repositories, so a stale or poisoned artifact in the local cache would
    // silently enter the build. Add it temporarily and locally if you need to
    // test an unpublished dependency.
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.tterrag.com/' }
    maven {
        name = 'Jared maven'
        url = 'https://maven.parchmentmc.org'
    }
}

// Create is optional at runtime. Its types are referenced directly by the Create
// integration code, so it is always on the compile classpath, but it can be left
// off the runtime classpath to verify the mod degrades correctly when it is absent:
//
//   gradlew runClient -PwithCreate=false
//
// Defaults to true, so a normal dev run is unchanged.
def withCreate = Boolean.parseBoolean((findProperty('withCreate') ?: 'true').toString())

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // Create for Minecraft 1.20.1 (Forge), version 6.0.8 build 291.
    // The '-all' classifier is the dev jar carrying Create's own classes. Pinned
    // to an exact build; same Create 6 API line as the 1.21.1 build. MIT licensed.
    compileOnly "com.simibubi.create:create-1.20.1:6.0.8-291:all"

    if (withCreate) {
        runtimeOnly "com.simibubi.create:create-1.20.1:6.0.8-291:all"
    }

    // Gson is bundled with Minecraft, declared for clarity.
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

// mods.toml is templated so the version numbers live only in gradle.properties.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_display_url        : mod_display_url,
            mod_issue_tracker_url  : mod_issue_tracker_url,
            mod_credits            : mod_credits
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
