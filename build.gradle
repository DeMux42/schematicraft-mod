plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    // mavenLocal() is intentionally absent. It takes precedence over remote
    // repositories, so a stale or poisoned artifact in the local cache would
    // silently enter the build. Add it temporarily and locally if you need to
    // test an unpublished dependency.
    mavenCentral()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.theillusivec4.top/" }
    exclusiveContent {
        forRepository { maven { url "https://cursemaven.com" } }
        filter { includeGroup "curse.maven" }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Shared, editor-agnostic Schematicraft library (browse/search/download/preview/camera).
// Kept as a separate source module so Fabric and Forge editor mods can reuse it.
// For release builds this would become a jarJar dependency instead.
sourceSets.main.java.srcDir '../schematicraft-lib/src/main/java'

// Official Schematicraft API client (shared across all integrations)
sourceSets.main.java.srcDir '../../api-clients/java/src'

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Both editors are optional at runtime. Their types are referenced directly by
// the integration code, so they are always needed on the compile classpath, but
// each can be left off the runtime classpath to verify that the mod degrades
// correctly when that editor is not installed:
//
//   gradlew runClient -PwithBG2=false
//   gradlew runClient -PwithCreate=false
//   gradlew runClient -PwithBG2=false -PwithCreate=false
//
// Both default to true, so a normal dev run is unchanged.
def withBG2 = Boolean.parseBoolean((findProperty('withBG2') ?: 'true').toString())
def withCreate = Boolean.parseBoolean((findProperty('withCreate') ?: 'true').toString())

dependencies {
    // Building Gadgets 2 (CurseMaven project 298187, file 6850515 = v1.3.9 for 1.21.1)
    compileOnly "curse.maven:building-gadgets-298187:6850515"

    // Curios API - required by BG2 at runtime (project 309927, file 6529130 = v9.5.1+1.21.1)
    compileOnly "curse.maven:curios-309927:6529130"

    // Create mod (CurseMaven project 328085, file 7178775 = v6.0.8 for 1.21.1)
    compileOnly "curse.maven:create-328085:7178775"

    if (withBG2) {
        localRuntime "curse.maven:building-gadgets-298187:6850515"
        localRuntime "curse.maven:curios-309927:6529130"
    }

    if (withCreate) {
        localRuntime "curse.maven:create-328085:7178775"
    }

    // Gson is bundled with MC, declared for clarity
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
