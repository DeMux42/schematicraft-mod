# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Parchment mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1

# Deliberately an exact pin, not a range.
#
# NeoForge's major.minor tracks the Minecraft minor: 21.0 is MC 1.21, 21.1 is
# 1.21.1, 21.2 is 1.21.2. This jar is compiled against 1.21.1 with NeoForge 21.1,
# so it cannot run on 1.21.2+ regardless of what this range says. Widening it to
# [1.21.1,1.22) would let the mod load on versions it was not built for and turn a
# clean "incompatible" message into a crash.
#
# Note for anyone revisiting this because a modpack rejected the mod: All the Mods
# 11 and similar current packs are on NeoForge 26.1, meaning Minecraft 26.1. That
# needs the 1.26 port, not a looser range here. See PORTING-26.1.md.
minecraft_version_range=[1.21.1]

neo_version=21.1.217
loader_version_range=[4,)

# Mod info
mod_id=schematicraft
mod_name=Schematicraft
# SPDX id. "LGPL-3.0" is deprecated and ambiguous, so this states version 3 only.
# Change to LGPL-3.0-or-later if you want to grant future LGPL versions too.
mod_license=LGPL-3.0-only
# Semantic version of the mod itself. Single source of truth: the mods.toml
# template consumes this, the jar name derives from it, and the runtime reads it
# back from the loader. Do not repeat this number anywhere else.
#
# For a mod, nobody compiles against us, so the three numbers are a message to
# users rather than an API contract:
#   PATCH  fixes only, drop in and go
#   MINOR  new features, new editor integrations, new screens
#   MAJOR  the user has to do something: reconfigure, re-enter a key, or accept
#          that a config or stored format changed
#
# Staying on 0.x until the config and key-storage formats have survived real
# users. Going to 1.0.0 is a promise to hold those still.
mod_version=0.4.0
mod_authors=DeMux42
mod_group_id=com.schematicraft
mod_description=Cloud library connector for Minecraft. Integrates with Building Gadgets 2, Create, and more.
mod_display_url=https://schematicraft.com
mod_issue_tracker_url=https://github.com/DeMux42/schematicraft-mod/issues
mod_credits=Building Gadgets 2 by Direwolf20. Create by simibubi and the Create team.
