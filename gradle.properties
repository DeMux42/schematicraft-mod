# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true

# Minecraft / Fabric
#
# Fabric 1.21.1 targets the same Minecraft version the NeoForge build supports,
# so the shared library's 1.21.1 mappings are reusable and this is a loader
# change, not a loader-and-version change (spec, Pieces table).
#
# Deliberately an exact version, as on the NeoForge build. A jar compiled against
# 1.21.1 cannot run on another version; Fabric's depends range in fabric.mod.json
# pins minecraft to 1.21.1 so a mismatch is a clean "incompatible" message, not a
# crash. Building for a different 1.21.x patch means a new branch, not a wider
# range here.
minecraft_version=1.21.1

# Yarn mappings. Fabric uses Yarn names, not the official Mojang names the
# deobfuscated NeoForge 26.1 artifact ships and the NeoForge 1.21.1 build maps via
# Parchment. Every net.minecraft type in the source is a Mojang name today and
# becomes its Yarn name in the source port.
yarn_mappings=1.21.1+build.3

# Fabric Loader, the lightweight mod loader (Apache-2.0). Newest stable for 1.21.1.
loader_version=0.19.5

# Fabric API, the version-specific common hooks (Apache-2.0).
fabric_version=0.116.17+1.21.1

# Mod info
mod_id=schematicraft
mod_name=Schematicraft
# SPDX id. "LGPL-3.0" is deprecated and ambiguous, so this states version 3 only.
mod_license=LGPL-3.0-only
# Semantic version of the mod itself; single source of truth. The fabric.mod.json
# template consumes this, the jar name derives from it, and the runtime reads it
# back from the loader.
mod_version=0.4.0-alpha.2
mod_authors=DeMux42
mod_group_id=com.schematicraft
mod_description=Cloud library connector for Minecraft. Integrates with Litematica on Fabric.
mod_display_url=https://schematicraft.com
mod_issue_tracker_url=https://github.com/DeMux42/schematicraft-mod/issues
mod_credits=Litematica by masa.
