# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge
#
# NeoForge 26.1 is Minecraft 26.1 ("1.26"). NeoForge now uses a four-component
# version: the first three identify the Minecraft version (26.1.2) and the last
# the NeoForge build. 26.1.2.117 is the latest stable 26.1.2 release.
minecraft_version=26.1.2

# Deliberately an exact pin, not a range.
#
# This jar is compiled against Minecraft 26.1.2 with NeoForge 26.1, so it cannot
# run on a different Minecraft version regardless of what this range says.
# Widening it would let the mod load where it was not built and turn a clean
# "incompatible" message into a crash.
minecraft_version_range=[26.1.2]

neo_version=26.1.2.117
# NeoForge 26.1's loader (FML) major is 8. Upper bound matters: a different major
# is a different API generation.
loader_version_range=[8,)

# Mod info
mod_id=schematicraft
mod_name=Schematicraft
# SPDX id. "LGPL-3.0" is deprecated and ambiguous, so this states version 3 only.
# Change to LGPL-3.0-or-later if you want to grant future LGPL versions too.
mod_license=LGPL-3.0-only
# Semantic version of the mod itself. Single source of truth: the mods.toml
# template consumes this, the jar name derives from it, and the runtime reads it
# back from the loader. Do not repeat this number anywhere else.
#
# For a mod, nobody compiles against us, so the three numbers are a message to
# users rather than an API contract:
#   PATCH  fixes only, drop in and go
#   MINOR  new features, new editor integrations, new screens
#   MAJOR  the user has to do something: reconfigure, re-enter a key, or accept
#          that a config or stored format changed
#
# Staying on 0.x until the config and key-storage formats have survived real
# users. Going to 1.0.0 is a promise to hold those still.
#
# Pre-release builds carry the stage in the version string, not only in the
# CurseForge or Modrinth channel, so the marker survives a download:
#   0.4.0-alpha.N   early, expect breakage
#   0.4.0-beta.N    feature complete, still shaking out bugs
#   0.4.0           released
# Semver orders those correctly, so promoting is a rename with nothing to undo.
# Increment N per build handed to anyone. Reset N to 1 when the target version
# changes. Set the platform channel to match: it is what decides whether
# launchers pull users into the build automatically.
mod_version=0.4.0-alpha.2
mod_authors=DeMux42
mod_group_id=com.schematicraft
mod_description=Cloud library connector for Minecraft. Integrates with Building Gadgets 2, Create, and more.
mod_display_url=https://schematicraft.com
mod_issue_tracker_url=https://github.com/DeMux42/schematicraft-mod/issues
mod_credits=Building Gadgets 2 by Direwolf20. Create by simibubi and the Create team.
