# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Parchment mappings
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Minecraft / Forge
minecraft_version=1.20.1

# Deliberately an exact pin, not a range.
#
# This jar is compiled against Minecraft 1.20.1 with Forge 47, so it cannot run
# on any other Minecraft version regardless of what this range says. Widening it
# to [1.20.1,1.21) would let the mod load on versions it was not built for and
# turn a clean "incompatible" message into a crash. The 1.21.1 and future ports
# are their own jars with their own ranges, told apart by the Minecraft version
# in the filename.
minecraft_version_range=[1.20.1]

# Forge for 1.20.1. Recommended build at the time of this port.
forge_version=1.20.1-47.4.10
# The mods.toml loader is "javafml". Forge 1.20.1 is FML version 47.
loader_version_range=[47,)
forge_version_range=[47,)

# Mod info
mod_id=schematicraft
mod_name=Schematicraft
# SPDX id. "LGPL-3.0" is deprecated and ambiguous, so this states version 3 only.
mod_license=LGPL-3.0-only
# Semantic version of the mod itself. Single source of truth: the mods.toml
# template consumes this, the jar name derives from it, and the runtime reads it
# back from the loader. Do not repeat this number anywhere else.
#
# This is the Forge 1.20.1 build. It carries the same feature set and the same
# mod version as the 1.21.1 build; the Minecraft version in the jar filename is
# what tells the two apart in a mods folder.
mod_version=0.4.0-alpha.2
mod_authors=DeMux42
mod_group_id=com.schematicraft
mod_description=Cloud library connector for Minecraft. Integrates with Create, and more.
mod_display_url=https://schematicraft.com
mod_issue_tracker_url=https://github.com/DeMux42/schematicraft-mod/issues
mod_credits=Create by simibubi and the Create team.
