name: Secret scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed Schematicraft API keys
        shell: bash
        run: |
          set -euo pipefail
          pattern='(sk_(live|test)_[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})'
          matches="$(git grep -IlE "$pattern" -- . || true)"
          if [[ -n "$matches" ]]; then
            printf '%s\n' 'Potential API keys found in:'
            printf '%s\n' "$matches"
            exit 1
          fi
